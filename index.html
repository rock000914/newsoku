<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>マイ・ニュースアンテナ</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📰%3C/text%3E%3C/svg%3E">
    <link rel="preconnect" href="https://api.rss2json.com" crossorigin>
    <link rel="dns-prefetch" href="https://api.allorigins.win">
    <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
    <link rel="stylesheet" href="style.css?v=25">
    <script src="config.js?v=25" defer></script>
    <script src="app.js?v=25" defer></script>
</head>
<body>
    <header class="top">
        <div class="top-row">
            <h1>📰 マイ・ニュースアンテナ <span class="kao">＼(*^◯^*)／</span></h1>
            <div class="actions">
                <button id="refresh-btn" class="btn" type="button">↻ 更新</button>
                <button id="theme-btn" class="btn" type="button" aria-label="テーマ切替"></button>
                <button id="settings-btn" class="btn" type="button" aria-label="フィード設定">⚙</button>
            </div>
        </div>
        <div class="nav-wrap">
            <nav id="source-nav" aria-label="サイト絞り込み"></nav>
            <button id="nav-more" class="btn" type="button" hidden>すべて表示</button>
        </div>
    </header>
    <main>
        <p id="status" role="status"></p>
        <div id="news" aria-live="polite">
            <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
            <div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div>
        </div>
    </main>
    <button id="new-bar" type="button" hidden>↑ 新着あり（タップで反映）</button>
    <footer>Powered by RSS</footer>
    <div id="settings-overlay" hidden>
        <div class="sheet" role="dialog" aria-label="フィード設定">
            <div class="sheet-head">
                <h2>フィード設定</h2>
                <button id="settings-close" class="btn" type="button">閉じる</button>
            </div>
            <div id="feed-list"></div>
            <h3>中継サーバー</h3>
            <div class="add-row">
                <input id="relay-url" type="url" inputmode="url" placeholder="https://xxx.workers.dev（空なら使わない）">
                <button id="relay-save" class="btn" type="button">保存</button>
            </div>
            <h3>追加</h3>
            <div class="add-row">
                <input id="add-name" type="text" maxlength="24" placeholder="名前（省略可）">
                <input id="add-url" type="url" inputmode="url" placeholder="サイトURLまたはRSSのURL">
            </div>
            <div class="add-row">
                <button id="discover-btn" class="btn" type="button">URLからRSSを探す</button>
                <button id="add-direct-btn" class="btn" type="button">このURLで追加</button>
            </div>
            <p id="settings-msg" role="status"></p>
            <div id="discover-result"></div>
            <p class="auto-save-note">追加・名前変更・ON/OFF・削除は自動でこの端末に保存されます。下のボタンは別端末へ渡す用です。</p>
            <div class="sheet-foot">
                <button id="feeds-export" class="btn" type="button">設定ファイルに書き出す</button>
                <button id="feeds-import" class="btn" type="button">設定ファイルから取り込む</button>
                <input id="feeds-file" type="file" accept="application/json,.json" hidden>
                <button id="feeds-reset" class="btn" type="button">初期状態に戻す</button>
            </div>
        </div>
    </div>
</body>
</html>
